<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chismeSs</title>
<style>
:root{--bg:#0d0b1f;--g:linear-gradient(135deg,#ff3d8b,#7c4dff);--glass:rgba(24,20,54,.62);--bd:rgba(255,255,255,.14);--tx:#f4f1ff;--mu:#a9a3d0;--am:#ffc857;--cy:#38e1ff;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#map{position:fixed;inset:0;z-index:0;background:#e8e4f0}
.pin{pointer-events:auto;cursor:pointer}
.pi{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--g);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 8px 26px rgba(255,61,139,.55);animation:drop .8s cubic-bezier(.2,1.3,.4,1) both}
.pi span{transform:rotate(45deg);font-size:19px}
@keyframes drop{from{opacity:0;transform:translateY(-100px) rotate(-45deg) scale(.5)}to{opacity:1;transform:rotate(-45deg)}}
@keyframes bob{0%,100%{transform:rotate(-45deg)}50%{transform:translateY(-9px) rotate(-45deg)}}
.gh .pi{background:linear-gradient(135deg,#ffc857,#ff3d8b);animation:bob 1.4s ease-in-out infinite;box-shadow:0 8px 30px rgba(255,200,87,.6)}
.gh::after{content:"";position:absolute;left:10px;top:46px;width:20px;height:7px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px)}
.me i{display:block;width:18px;height:18px;border-radius:50%;background:var(--cy);border:3px solid #fff;box-shadow:0 0 18px var(--cy)}
.me i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--cy);animation:ping 2s ease-out infinite}
@keyframes ping{to{transform:scale(3.4);opacity:0}}
.gl{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#logo{position:fixed;z-index:5;top:calc(var(--sa) + 14px);left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:99px;font-weight:800;font-size:19px;letter-spacing:-.3px;animation:in .8s .1s cubic-bezier(.2,.9,.3,1) both}
#logo b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.col{position:fixed;z-index:5;left:calc(14px + env(safe-area-inset-left,0px));top:calc(var(--sa) + 92px);display:flex;flex-direction:column;gap:14px}
.fb{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.5,.5,1);animation:in .7s calc(var(--d)*.12s + .3s) cubic-bezier(.2,.9,.3,1) both}
.fb:active{transform:scale(.88)}
.fb svg,#fab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes in{from{opacity:0;transform:translate(-30px,0) scale(.7)}}
#logo{animation-name:inl}@keyframes inl{from{opacity:0;transform:translate(-50%,-20px)}}
.bd{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--g);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #1b1640;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#fab{position:fixed;z-index:6;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--sb) + 28px);width:66px;height:66px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 12px 36px rgba(255,61,139,.55);transition:transform .5s cubic-bezier(.3,1.4,.4,1),opacity .3s;animation:fin .8s .7s cubic-bezier(.2,1.3,.4,1) both}
#fab svg{width:30px;height:30px;stroke-width:2.6;transition:transform .4s}
#fab:hover svg{transform:rotate(90deg)}
#fab::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--g);z-index:-1;animation:ping 2.6s ease-out infinite}
#fab:active{transform:scale(.9)}
#fab.off{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none;animation:none}
@keyframes fin{from{opacity:0;transform:scale(0) rotate(-90deg)}}
#sheet{position:fixed;z-index:20;left:50%;bottom:0;width:min(480px,100%);max-height:84vh;overflow:auto;padding:12px 20px calc(var(--sb) + 20px);border-radius:30px 30px 0 0;background:rgba(18,14,44,.86);transform:translate(-50%,108%);transition:transform .65s cubic-bezier(.2,.9,.25,1.05)}
#sheet.open{transform:translate(-50%,0)}
#sheet.shake{animation:shake .4s}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
.hd{width:42px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h2{font-size:23px;font-weight:800;letter-spacing:-.4px}
h2 span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px}
label{display:block;color:var(--mu);font-size:13px;margin:0 0 7px 4px}
.af{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--bd);transition:.25s}
.af:focus-within,textarea:focus{border-color:#ff3d8b;box-shadow:0 0 0 4px rgba(255,61,139,.18)}
.af svg{width:20px;height:20px;flex:none;stroke:var(--am);fill:none;stroke-width:2}
input,textarea{width:100%;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:14px 0}
input::placeholder,textarea::placeholder{color:#7d77a8}
.chips{display:flex;gap:8px;margin:12px 0 18px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--bd);font-size:14px;transition:.2s}
.chip:active{background:var(--g);transform:scale(.94)}
textarea{padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--bd);resize:none;transition:.25s}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
#cnt{color:var(--mu);font-size:13px}
.go{position:relative;overflow:hidden;padding:15px 26px;border-radius:99px;background:var(--g);font-weight:800;box-shadow:0 10px 28px rgba(255,61,139,.45);transition:transform .2s}
.go:active{transform:scale(.95)}
.go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
.dock{position:fixed;z-index:21;left:50%;bottom:calc(var(--sb) + 18px);width:min(440px,calc(100% - 28px));padding:16px 18px;border-radius:24px;transform:translate(-50%,160%);transition:transform .6s cubic-bezier(.2,.9,.25,1.05);display:flex;align-items:center;gap:12px;justify-content:space-between}
.dock.on{transform:translate(-50%,0)}
.dock small{display:block;color:var(--mu);font-size:12px}
.dock p{font-size:15px;margin-top:2px}
#card{display:block;z-index:15}
#card .ad{color:var(--am);font-weight:700;font-size:14px;margin-bottom:6px}
#card .tx{font-size:17px;line-height:1.45}
#card small{margin-top:10px}
#pop{position:fixed;z-index:8;left:calc(80px + env(safe-area-inset-left,0px));top:calc(var(--sa) + 92px);width:min(280px,calc(100vw - 100px));padding:16px;border-radius:20px;transform-origin:left top;transform:scale(.6);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,1.4,.5,1)}
#pop.on{transform:none;opacity:1;pointer-events:auto}
#pop p{color:var(--mu);font-size:14px;margin-top:6px}
#pop div{padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
#pop div:first-of-type{margin-top:8px}
#toast{position:fixed;z-index:30;left:50%;top:calc(var(--sa) + 70px);padding:11px 20px;border-radius:99px;transform:translate(-50%,-30px);opacity:0;transition:.45s cubic-bezier(.3,1.4,.5,1);pointer-events:none;white-space:nowrap;font-size:14px}
#toast.on{transform:translate(-50%,0);opacity:1}
#lay{position:fixed;z-index:6;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(var(--sb) + 112px);width:50px;height:50px;color:#fff;transition:transform .4s cubic-bezier(.3,1.4,.4,1),opacity .3s}
#lay.off{animation:none;transform:scale(0);opacity:0;pointer-events:none}
#res{display:none;margin-top:8px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid var(--bd)}
#res.on{display:block}
#res button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:14px}
#res button+button{border-top:1px solid var(--bd)}
#perm{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(13,11,31,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .7s,visibility .7s}
#perm.hide{opacity:0;visibility:hidden}
.pc{max-width:380px;text-align:center;padding:32px 24px;border-radius:30px}
.pc p{color:var(--mu);margin:10px 0 24px}
.orb{position:relative;width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 12px 36px rgba(255,61,139,.5)}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ff3d8b;animation:ping 2.4s ease-out infinite}
.orb::after{animation-delay:1.2s}
.orb svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;font-size:10px!important;margin-bottom:calc(var(--sb) + 4px)!important}
.pin,.gh{position:relative;width:40px;height:40px;transform:translateY(8px)}
.me{position:relative;width:18px;height:18px;transform:translateY(9px)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="map"></div>

<div id="logo" class="gl"><b>chismeSs</b></div>
<div class="col">
  <button class="fb gl" id="b-chat" style="--d:1;color:#ff7ab0" aria-label="Chats"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></button>
  <button class="fb gl" id="b-loc" style="--d:2;color:var(--cy)" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
  <button class="fb gl" id="b-bell" style="--d:3;color:var(--am)" aria-label="Notificaciones"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 0 0 4 0"/></svg><span class="bd" id="bd">3</span></button>
</div>
<div id="pop" class="gl"></div>
<button id="fab" aria-label="Contar nuevo chisme"><svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="sheet" class="gl">
  <div class="hd"></div>
  <div class="top"><h2><span>Contar nuevo chisme</span> 🤫</h2><button class="x" id="close" aria-label="Cerrar">×</button></div>
  <label>¿Dónde pasó?</label>
  <div class="af"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><input id="addr" placeholder="Escribe una dirección…" autocomplete="off"></div>
  <div id="res"></div>
  <div class="chips">
    <button class="chip" id="c1">📍 Mi ubicación</button>
    <button class="chip" id="c2">🔎 Buscar dirección</button>
    <button class="chip" id="c3">✋ Arrastrar en el mapa</button>
  </div>
  <label>El chisme</label>
  <textarea id="txt" rows="3" maxlength="280" placeholder="Cuéntalo todo… 👀"></textarea>
  <div class="ft"><span id="cnt">0 / 280</span><button class="go" id="send">Publicar chisme</button></div>
</div>

<div id="bar" class="dock gl"><div><small>Ubicación del chisme</small><p id="da"></p></div><button class="go" id="ok">Confirmar</button></div>
<div id="card" class="dock gl"><div><div class="ad" id="ca"></div><div class="tx" id="ct"></div><small id="cw"></small></div></div>
<button class="fb gl" id="lay" style="--d:4" aria-label="Cambiar tipo de mapa"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg></button>
<div id="perm"><div class="pc gl"><div class="orb"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h2 id="pt"></h2><p id="pp"></p><button class="go" id="pb"></button></div></div>
<div id="toast" class="gl"></div>

<script>
const $=s=>document.querySelector(s);
let tt,ps='ask';
const PT={ask:['Activa tu ubicación','chismeSs usa tu ubicación para ponerte en el mapa y mostrarte los chismes que hay cerca. Se actualiza en tiempo real mientras la app esté abierta.','Permitir ubicación'],
 load:['Buscando tu ubicación…','Si el navegador te lo pide, toca Permitir. Puede tardar unos segundos.','Buscando…'],
 denied:['Ubicación bloqueada','Sin tu ubicación no podemos mostrarte el mapa. Toca el candado junto a la dirección, elige Ubicación → Permitir y pulsa Reintentar.','Reintentar'],
 nosup:['Ubicación no disponible','Abre chismeSs en Chrome, Safari o Firefox desde una dirección https:// o localhost.','Reintentar'],
 net:['No se pudo conectar con Google Maps','Abre este archivo en Chrome o Safari con internet. Dentro de la vista previa de Claude o sin conexión no carga.','Recargar'],
 err:['Error al iniciar el mapa','','Recargar'],
 key:['Google Maps no cargó','En Google Cloud revisa que Maps JavaScript API esté activada, que la facturación esté habilitada y que este dominio esté permitido en la clave.','Recargar']};
function perm(k){ps=k;const[t,p,b]=PT[k];$('#pt').textContent=t;$('#pp').textContent=p;$('#pb').textContent=b;$('#perm').classList.remove('hide')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
window.gm_authFailure=()=>perm('key');
perm('ask');
setTimeout(()=>{if(!(window.google&&google.maps&&google.maps.Map)){perm('net');$('#pb').onclick=()=>location.reload()}},7000);

function initMap(){try{init()}catch(e){perm('err');$('#pp').textContent='Detalle: '+e.message;console.error(e)}}
function init(){
const GM=google.maps,AM=GM.marker.AdvancedMarkerElement,sh=$('#sheet'),fab=$('#fab'),lay=$('#lay'),ai=$('#addr'),pop=$('#pop'),card=$('#card'),bar=$('#bar'),res=$('#res');
let mode='',dr=null,me=null,mm=null,mc=null,wid=null,first=1,list=[],pk='',rt=0,sd,fid=0,sat=0,tok=null;
const map=new GM.Map($('#map'),{center:{lat:15,lng:-60},zoom:3,mapId:'DEMO_MAP_ID',disableDefaultUI:true,gestureHandling:'greedy',clickableIcons:false});
const ll=p=>typeof p.lat=='function'?p:new GM.LatLng(p.lat,p.lng),fmt=l=>l.lat().toFixed(5)+', '+l.lng().toFixed(5),short=s=>s.split(',').slice(0,3).join(',');
const el=(c,h)=>{const e=document.createElement('div');e.className=c;e.innerHTML=h;return e},PIN='<div class="pi"><span>🤫</span></div>';
const mk=(l,e,o)=>new AM({position:l,content:e,...o});
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'hace un momento':m<60?`hace ${m} min`:m<1440?`hace ${Math.floor(m/60)} h`:`hace ${Math.floor(m/1440)} d`};
lay.onclick=()=>{sat=!sat;map.setMapTypeId(sat?'hybrid':'roadmap');toast('Mapa: '+(sat?'Satélite':'Calles'))};
function fly(l,z,off=0){const id=++fid,pr=map.getProjection();if(!pr)return map.moveCamera({center:l,zoom:z});
 const sc=2**z,p=pr.fromLatLngToPoint(l),t=pr.fromPointToLatLng(new GM.Point(p.x,p.y+off/sc)),c=map.getCenter(),a=[c.lat(),c.lng(),map.getZoom()],t0=performance.now();
 (function st(n){if(id!=fid)return;let k=Math.min(1,(n-t0)/1100);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  map.moveCamera({center:{lat:a[0]+(t.lat()-a[0])*k,lng:a[1]+(t.lng()-a[1])*k},zoom:a[2]+(z-a[2])*k});if(k<1)requestAnimationFrame(st)})(t0)}

/* ---------- Ubicación (permiso + seguimiento continuo) ---------- */
function onPos(p){const l=new GM.LatLng(p.coords.latitude,p.coords.longitude);me=l;
 if(!mm){mm=mk(l,el('me','<i></i>'),{map,zIndex:500});mc=new GM.Circle({map,center:l,radius:p.coords.accuracy,strokeColor:'#38e1ff',strokeWeight:1,fillColor:'#38e1ff',fillOpacity:.12,clickable:false})}
 else{mm.position=l;mc.setCenter(l);mc.setRadius(p.coords.accuracy)}
 if(first){first=0;$('#perm').classList.add('hide');fly(l,17);seed(l)}}
function onErr(e){if(e.code==1){if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;perm('denied')}else toast('Buscando señal de GPS…')}
function start(){if(!navigator.geolocation)return perm('nosup');if(wid!=null)navigator.geolocation.clearWatch(wid);wid=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
$('#pb').onclick=()=>{if(ps=='key')return location.reload();perm('load');start()};
if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(s=>{if(s.state=='granted'){perm('load');start()}
 s.onchange=()=>{if(s.state=='granted'&&wid==null){perm('load');start()}else if(s.state=='denied')perm('denied')}}).catch(()=>{});
$('#b-loc').onclick=()=>{closeUI();me?fly(me,17):perm('ask')};

/* ---------- Direcciones (Google Geocoding + Places) ---------- */
const geo=new GM.Geocoder();
async function rev(l){try{const{results}=await geo.geocode({location:l,language:'es'});return results[0]?short(results[0].formatted_address):fmt(l)}catch(e){return fmt(l)}}
async function resolve(l){const t=++rt;$('#da').textContent=ai.value='Buscando dirección…';const s=await rev(l);if(t==rt)$('#da').textContent=ai.value=s}
ai.oninput=()=>{clearTimeout(sd);const q=ai.value.trim();if(q.length<3){res.classList.remove('on');return}
 sd=setTimeout(async()=>{try{tok=tok||new GM.places.AutocompleteSessionToken();
  const{suggestions}=await GM.places.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q,language:'es',sessionToken:tok,locationBias:{center:map.getCenter(),radius:30000}});
  res.innerHTML='';suggestions.forEach(s=>{const p=s.placePrediction,n=p.text.toString(),b=document.createElement('button');b.textContent='📍 '+n;
   b.onclick=async()=>{res.classList.remove('on');const pl=p.toPlace();await pl.fetchFields({fields:['location']});tok=null;setDraft(pl.location,n);fly(pl.location,17,innerHeight*.22)};res.append(b)});
  res.classList.toggle('on',suggestions.length>0)}catch(e){toast('Activa Places API (New) o pulsa Enter para buscar')}},350)};
ai.onkeydown=async e=>{if(e.key!='Enter')return;try{const{results}=await geo.geocode({address:ai.value,language:'es'});if(!results[0])return toast('No encontré esa dirección');
 const l=results[0].geometry.location;res.classList.remove('on');ai.blur();setDraft(l,short(results[0].formatted_address));fly(l,17,innerHeight*.22)}catch(e){toast('No pude buscar esa dirección')}};

/* ---------- Chismes ---------- */
const g=mk(new GM.LatLng(0,0),el('gh',PIN),{gmpDraggable:true,zIndex:900});
g.addListener('dragend',()=>setDraft(ll(g.position)));
function setDraft(l,label){dr=l;g.position=l;label?ai.value=label:resolve(l)}
function add(c,d=0){c.ll=new GM.LatLng(c.lat,c.lng);const e=el('pin',PIN);e.firstChild.style.animationDelay=d+'ms';const m=mk(c.ll,e,{map,gmpClickable:true});m.addListener('click',()=>showCard(c));list.push(c)}
function save(){try{localStorage.setItem('cs',JSON.stringify(list.map(({lat,lng,a,t,ts})=>({lat,lng,a,t,ts}))))}catch(e){}}
function seed(l){if(list.length)return;[[.0012,-.0015,'El vecino de enfrente ensaya trompeta a las 6 a. m. y cree que nadie lo sabe 🎺'],[-.0009,.0018,'Aquí venden las mejores empanadas… y el secreto es la salsa de la abuela 🥟'],[.0021,.0006,'Hoy vi a alguien discutiendo con una paloma por un pan. La paloma ganó 🕊️']]
 .forEach(([a,b,t],i)=>add({lat:l.lat()+a,lng:l.lng()+b,a:'Cerca de ti',t,ts:Date.now()-(i+1)*9e5},2500+i*200));save()}
function showCard(c){closeUI();$('#ca').textContent='📍 '+c.a;$('#ct').textContent=c.t;$('#cw').textContent=ago(c.ts);card.classList.add('on');fly(c.ll,Math.max(map.getZoom(),16),innerHeight*.18)}
function closeUI(){pop.classList.remove('on');card.classList.remove('on');pk=''}
function showPop(k,h){if(pk==k){closeUI();return}closeUI();pk=k;pop.innerHTML=h;pop.classList.add('on')}
$('#b-chat').onclick=()=>showPop('c','<b>💬 Tus chats</b><p>Aún no tienes conversaciones. Pronto podrás chatear con quien cuente un chisme.</p>');
$('#b-bell').onclick=()=>{showPop('b','<b>🔔 Notificaciones</b><div>🔥 Tu chisme está dando de qué hablar</div><div>📍 3 chismes nuevos cerca de ti</div><div>💜 Bienvenido a chismeSs</div>');$('#bd').style.display='none'};
map.addListener('click',e=>{closeUI();if(mode=='sheet')setDraft(e.latLng)});
map.addListener('center_changed',()=>{if(mode=='drag'){dr=map.getCenter();g.position=dr}});
map.addListener('idle',()=>{if(mode=='drag')resolve(dr)});
map.addListener('dragstart',()=>fid++);
$('#map').addEventListener('wheel',()=>fid++,{passive:true});

function open(){closeUI();mode='sheet';const l=me||map.getCenter();g.map=map;sh.classList.add('open');fab.classList.add('off');lay.classList.add('off');setDraft(l);fly(l,Math.max(map.getZoom(),16),innerHeight*.22)}
function shut(){mode='';sh.classList.remove('open');bar.classList.remove('on');res.classList.remove('on');fab.classList.remove('off');lay.classList.remove('off');g.map=null}
fab.onclick=open;$('#close').onclick=shut;
$('#c1').onclick=()=>{if(!me)return toast('Aún no tengo tu ubicación');setDraft(me);fly(me,17,innerHeight*.22)};
$('#c2').onclick=()=>{ai.focus();ai.select()};
$('#c3').onclick=()=>{mode='drag';res.classList.remove('on');sh.classList.remove('open');bar.classList.add('on');fly(dr,Math.max(map.getZoom(),17),0)};
$('#ok').onclick=()=>{mode='sheet';bar.classList.remove('on');sh.classList.add('open');fly(dr,map.getZoom(),innerHeight*.22)};
$('#txt').oninput=e=>$('#cnt').textContent=e.target.value.length+' / 280';
$('#send').onclick=()=>{const t=$('#txt').value.trim();if(!t){sh.classList.add('shake');setTimeout(()=>sh.classList.remove('shake'),400);return toast('Escribe el chisme primero 👀')}
 const c={lat:dr.lat(),lng:dr.lng(),a:ai.value.trim()||fmt(dr),t,ts:Date.now()},z=Math.max(map.getZoom(),17);shut();$('#txt').value='';$('#cnt').textContent='0 / 280';
 fly(dr,z,0);setTimeout(()=>{add(c);save();toast('¡Chisme publicado! 🤫')},1000)};
try{(JSON.parse(localStorage.getItem('cs'))||[]).forEach(c=>add(c))}catch(e){}
}
</script>
<script async onerror="perm('net');$('#pb').onclick=()=>location.reload()" src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCYg-g3SdAebeVUP-RFYTupj4MnRnSvmZo&v=weekly&language=es&libraries=marker,places&callback=initMap"></script>
</body></html>
